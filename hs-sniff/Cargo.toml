[package]
name = "hs-sniff"
version = "0.1.0"
edition = "2021"
description = "Hero Siege passive packet-sniffing toolkit: capture, reassemble, decode game traffic into normalized events. Library + CLI + MCP server."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
form_urlencoded = "1"

# Live capture (feature `live`). Everything else is pure std + serde.
pcap = { version = "2", optional = true }
etherparse = { version = "0.16", optional = true }
netstat2 = { version = "0.11", optional = true }
sysinfo = { version = "0.33", optional = true, default-features = false, features = ["system"] }

[features]
default = ["live"]
live = ["dep:pcap", "dep:etherparse", "dep:netstat2", "dep:sysinfo"]

[[bin]]
name = "hs-sniff"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
