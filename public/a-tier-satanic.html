<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #1a1020 0%, var(--bg-primary) 55%);

  .container { max-width: 1200px; margin: 0 auto; padding: 28px 20px 80px; }

  header { border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-icon {

  .chip {

  .filter-group { display: flex; align-items: center; gap: 8px; }

  .table-wrap { border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; background: var(--bg-card); }

  thead th.col-slot { width: 110px; }

  thead th.col-sock { width: 110px; }
  tbody tr {
    border-bottom: 1px solid var(--border-color); transition: background 0.12s;

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg-hover); }
  tbody td { padding: 12px 16px; vertical-align: middle; }
  td.item-name { font-weight: 600; color: #fff; }
  td.item-name .rarity-dot {

  footer { margin-top: 24px; font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono); text-align: center; }
</style>
</head>
<body>
<div class="container">
  <header>

        <div>

  <div class="toolbar">

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-name" data-key="name">Item <span class="arrow"></span></th>
          <th class="col-slot" data-key="slot">Slot <span class="arrow"></span></th>
          <th class="col-lvl" data-key="requiresLevel">Req <span class="arrow"></span></th>
          <th class="col-sock" data-key="maxSockets">Sockets <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty-state" id="empty" style="display:none">No items match the current filters.</div>
  </div>

  <footer>data: data/unified-items.json · generated from repository datasets</footer>
</div>

<script>
const DATA = [{"id":"helmet_satanic_ancient_avenger","name":"Ancient Avenger","slot":"helmet","requiresLevel":61,"maxSockets":3},{"id":"helmet_satanic_demon_warlord_s_helm","name":"Demon Warlord's Helm","slot":"helmet","requiresLevel":57,"maxSockets":3},{"id":"helmet_satanic_guise_of_the_dead","name":"Guise of the Dead","slot":"helmet","requiresLevel":57,"maxSockets":3},{"id":"helmet_satanic_sand_traveler_s_guise","name":"Sand Traveler's Guise","slot":"helmet","requiresLevel":58,"maxSockets":3},{"id":"helmet_satanic_underworld_s_skullbreaker","name":"Underworld's Skullbreaker","slot":"helmet","requiresLevel":57,"maxSockets":1},{"id":"body_armor_satanic_gladiator_s_demise","name":"Gladiator's Demise","slot":"armor","requiresLevel":57,"maxSockets":2},{"id":"body_armor_satanic_grandwizard_s_robe","name":"Grandwizard's Robe","slot":"armor","requiresLevel":57,"maxSockets":3},{"id":"body_armor_satanic_mystique_allure","name":"Mystique Allure","slot":"armor","requiresLevel":60,"maxSockets":6},{"id":"body_armor_satanic_zephy_s_gown","name":"Zephy's Gown","slot":"armor","requiresLevel":57,"maxSockets":3},{"id":"staff_satanic_archangel_staff","name":"Archangel Staff","slot":"weapon","requiresLevel":52,"maxSockets":6},{"id":"bow_satanic_buriza_ko_nu","name":"Buriza-Ko-Nu","slot":"weapon","requiresLevel":66,"maxSockets":5},{"id":"flask_satanic_cobra_blood_vial","name":"Cobra Blood Vial","slot":"weapon","requiresLevel":62,"maxSockets":3},{"id":"bow_satanic_electro","name":"Electro","slot":"weapon","requiresLevel":61,"maxSockets":4},{"id":"staff_satanic_flame_of_the_phoenix","name":"Flame of the Phoenix","slot":"weapon","requiresLevel":62,"maxSockets":6},{"id":"mace_satanic_gladiator_s_skullcrusher","name":"Gladiator's Skullcrusher","slot":"weapon","requiresLevel":49,"maxSockets":1},{"id":"sword_satanic_godfather","name":"Godfather","slot":"weapon","requiresLevel":65,"maxSockets":6},{"id":"sword_satanic_gut_s_bfs","name":"Gut's BFS","slot":"weapon","requiresLevel":52,"maxSockets":3},{"id":"claw_satanic_hemorrhage","name":"Hemorrhage","slot":"weapon","requiresLevel":57,"maxSockets":2},{"id":"sword_satanic_holy_warrior_s_phase_blade","name":"Holy Warrior's Phase Blade","slot":"weapon","requiresLevel":66,"maxSockets":1},{"id":"mace_satanic_icy_crusher","name":"Icy Crusher","slot":"weapon","requiresLevel":47,"maxSockets":1},{"id":"dagger_satanic_icy_shank","name":"Icy Shank","slot":"weapon","requiresLevel":57,"maxSockets":2},{"id":"polearm_satanic_jousting_lance","name":"Jousting Lance","slot":"weapon","requiresLevel":62,"maxSockets":6},{"id":"mace_satanic_nightmare_slasher","name":"Nightmare Slasher","slot":"weapon","requiresLevel":40,"maxSockets":2},{"id":"polearm_satanic_odin_s_battle_spear","name":"Odin's Battle Spear","slot":"weapon","requiresLevel":65,"maxSockets":5},{"id":"staff_satanic_raise_of_the_dead","name":"Raise of the Dead","slot":"weapon","requiresLevel":55,"maxSockets":6},{"id":"axe_satanic_rift_commander_s_axe","name":"Rift Commander's Axe","slot":"weapon","requiresLevel":66,"maxSockets":2},{"id":"mace_satanic_sacred_whip","name":"Sacred Whip","slot":"weapon","requiresLevel":65,"maxSockets":4},{"id":"book_satanic_sands_of_time","name":"Sands of Time","slot":"weapon","requiresLevel":61,"maxSockets":4},{"id":"chainsaw_satanic_sawgun","name":"Sawgun","slot":"weapon","requiresLevel":58,"maxSockets":1},{"id":"spellblade_satanic_spellshard","name":"Spellshard","slot":"weapon","requiresLevel":56,"maxSockets":3},{"id":"dagger_satanic_thunder_dagger","name":"Thunder Dagger","slot":"weapon","requiresLevel":64,"maxSockets":2},{"id":"mace_satanic_unholy_god_s_flail","name":"Unholy God's Flail","slot":"weapon","requiresLevel":48,"maxSockets":1},{"id":"gun_satanic_vampire_hunter","name":"Vampire Hunter","slot":"weapon","requiresLevel":60,"maxSockets":5},{"id":"chainsaw_satanic_vorpal_sharktooth","name":"Vorpal Sharktooth","slot":"weapon","requiresLevel":63,"maxSockets":5},{"id":"sword_satanic_wind_guardian_s_gladius","name":"Wind Guardian's Gladius","slot":"weapon","requiresLevel":61,"maxSockets":3},{"id":"spellblade_satanic_wormclaw","name":"Wormclaw","slot":"weapon","requiresLevel":63,"maxSockets":1},{"id":"gloves_satanic_plated_crimson_defenders","name":"Plated Crimson Defenders","slot":"gloves","requiresLevel":52,"maxSockets":1},{"id":"gloves_satanic_scuttle_crab_gauntlets","name":"Scuttle Crab Gauntlets","slot":"gloves","requiresLevel":52,"maxSockets":1},{"id":"gloves_satanic_siege_breakers","name":"Siege Breakers","slot":"gloves","requiresLevel":52,"maxSockets":1},{"id":"boots_satanic_arch_wizard_s_silk_boots","name":"Arch Wizard's Silk Boots","slot":"boots","requiresLevel":62,"maxSockets":1},{"id":"boots_satanic_steadfast_marchers","name":"Steadfast Marchers","slot":"boots","requiresLevel":55,"maxSockets":1},{"id":"boots_satanic_tundra_marchers","name":"Tundra Marchers","slot":"boots","requiresLevel":57,"maxSockets":1},{"id":"belt_satanic_ashen_belt","name":"Ashen Belt","slot":"belt","requiresLevel":64,"maxSockets":1},{"id":"belt_satanic_combat_duty_belt","name":"Combat Duty Belt","slot":"belt","requiresLevel":68,"maxSockets":1},{"id":"belt_satanic_gaze_of_the_void","name":"Gaze of the Void","slot":"belt","requiresLevel":46,"maxSockets":1},{"id":"belt_satanic_hatshepsut_s_girdle","name":"Hatshepsut's Girdle","slot":"belt","requiresLevel":64,"maxSockets":1},{"id":"belt_satanic_sun_wukong_s_belt","name":"Sun Wukong's Belt","slot":"belt","requiresLevel":48,"maxSockets":1},{"id":"belt_satanic_tribal_belt","name":"Tribal Belt","slot":"belt","requiresLevel":50,"maxSockets":1},{"id":"belt_satanic_warbosses_trophy_belt","name":"Warbosses' Trophy Belt","slot":"belt","requiresLevel":52,"maxSockets":1},{"id":"amulet_satanic_arcana_eye","name":"Arcana Eye","slot":"amulet","requiresLevel":61,"maxSockets":1},{"id":"amulet_satanic_baby_log_necklace","name":"Baby Log Necklace","slot":"amulet","requiresLevel":64,"maxSockets":1},{"id":"amulet_satanic_claw_of_the_hunter","name":"Claw of the Hunter","slot":"amulet","requiresLevel":58,"maxSockets":1},{"id":"amulet_satanic_eye_of_horus","name":"Eye of Horus","slot":"amulet","requiresLevel":65,"maxSockets":1},{"id":"amulet_satanic_ritual_pendant","name":"Ritual Pendant","slot":"amulet","requiresLevel":59,"maxSockets":1},{"id":"amulet_satanic_scout_s_medal_of_honor","name":"Scout's Medal of Honor","slot":"amulet","requiresLevel":60,"maxSockets":1},{"id":"amulet_satanic_treasure_pendant","name":"Treasure Pendant","slot":"amulet","requiresLevel":66,"maxSockets":1},{"id":"amulet_satanic_visage_s_eye","name":"Visage's Eye","slot":"amulet","requiresLevel":62,"maxSockets":1},{"id":"ring_satanic_archer_s_story","name":"Archer's Story","slot":"ring_1","requiresLevel":54,"maxSockets":0},{"id":"ring_satanic_onyx_slayer_s_band","name":"Onyx Slayer's Band","slot":"ring_1","requiresLevel":54,"maxSockets":0},{"id":"ring_satanic_templar_s_faith","name":"Templar's Faith","slot":"ring_1","requiresLevel":54,"maxSockets":0},{"id":"shield_satanic_battle_mage_s_shield","name":"Battle Mage's Shield","slot":"offhand","requiresLevel":58,"maxSockets":2},{"id":"shield_satanic_den_glider_in","name":"Den Glider In","slot":"offhand","requiresLevel":57,"maxSockets":1},{"id":"shield_satanic_lancer_s_wall","name":"Lancer's Wall","slot":"offhand","requiresLevel":55,"maxSockets":1},{"id":"shield_satanic_rift_eye","name":"Rift Eye","slot":"offhand","requiresLevel":64,"maxSockets":1},{"id":"shield_satanic_the_templar","name":"The Templar","slot":"offhand","requiresLevel":61,"maxSockets":1}];

const SLOT_LABELS = {
  helmet: 'Helmet', armor: 'Armor', weapon: 'Weapon', gloves: 'Gloves',
  boots: 'Boots', belt: 'Belt', amulet: 'Amulet', ring_1: 'Ring', offhand: 'Off-Hand'
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const state = { search: '', slot: 'all', sockets: 'all', sortKey: 'name', sortDir: 1 };

const items = DATA.map((raw, idx) => ({ ...raw, idx }));
const slots = ['all', ...new Set(items.map(i => i.slot))];
const socketValues = ['all', ...[...new Set(items.map(i => i.maxSockets))].sort((a, b) => a - b)];

function renderChips(containerId, values, labelFor, onPick) {
  const wrap = document.getElementById(containerId);
  values.forEach(v => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (v === 'all' ? ' active' : '');
    chip.textContent = v === 'all' ? 'All' : String(labelFor(v));
    chip.dataset.value = v;
    chip.onclick = () => {
      wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      onPick(v);
      render();
    };
    wrap.appendChild(chip);
  });
}

renderChips('slot-chips', slots, v => SLOT_LABELS[v] || v, v => { state.slot = v; });
renderChips('socket-chips', socketValues, v => v + ' socket' + (v === 1 ? '' : 's'), v => { state.sockets = v; });

document.getElementById('total-count').textContent = items.length;
document.getElementById('slot-count').textContent = slots.length - 1;
document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value.toLowerCase().trim();
  render();
});
document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    state.sortDir = state.sortKey === key ? -state.sortDir : 1;
    state.sortKey = key;
    document.querySelectorAll('th .arrow').forEach(a => a.textContent = '');
    th.querySelector('.arrow').textContent = state.sortDir === 1 ? '▲' : '▼';
    render();
  });
});

function filtered() {
  let list = items.filter(i =>
    (state.slot === 'all' || i.slot === state.slot) &&
    (state.sockets === 'all' || i.maxSockets === Number(state.sockets)) &&
    (!state.search || i.name.toLowerCase().includes(state.search))
  );
  list.sort((a, b) => {
    const k = state.sortKey;
    if (k === 'name' || k === 'slot') return state.sortDir * String(a[k]).localeCompare(String(b[k]));
    return state.sortDir * (a[k] - b[k]);
  });
  return list;
}

const tbody = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
function render() {
  const list = filtered();
  tbody.innerHTML = '';
  emptyEl.style.display = list.length ? 'none' : 'block';
  document.getElementById('shown-count').textContent = list.length;
  document.getElementById('filtered-count').textContent = items.length;
  list.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="item-name"><span class="rarity-dot"></span>' + esc(item.name) + '<span class="grade-tag">A</span></td>' +
      '<td class="cell">' + (SLOT_LABELS[item.slot] || item.slot) + '</td>' +
      '<td class="cell">' + item.requiresLevel + '</td>' +
      '<td class="cell"><span class="slots">' + item.maxSockets + '</span></td>';
    tbody.appendChild(tr);
  });
}

render();
</script>
