[package]
name = "hs-plan"
version = "0.1.0"
edition = "2021"
description = "Hero Siege build planning: vendored HSPlanner calc + tree-suggestion engine, headless CLI + MCP."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
regex = "1"
base64 = "0.23"
log = "0.4"

[dev-dependencies]

[lib]
name = "hs_plan"
path = "src/lib.rs"

[[bin]]
name = "hs-plan"
path = "src/main.rs"

[[bin]]
name = "serve-ui"
path = "src/bin/serve-ui.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
